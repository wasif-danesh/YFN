# Hosts the renter homepage, basic comparison and separate API test console.
# The site is published and indexable; only the developer API console stays noindex.
# Root directory is omitted intentionally: both builds use the repository root.
services:
  - type: web
    name: yfn-api
    runtime: python
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: python -m pip install -r backend/requirements.txt && python scripts/check_sample.py
    startCommand: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: DATABASE_PATH
        value: data/greater-melbourne-v1/yfn.sqlite
      - key: CORS_ALLOWED_ORIGINS
        sync: false
    buildFilter:
      paths:
        - backend/**
        - contracts/**
        - data/greater-melbourne-v1/**
        - scripts/**
        - .python-version
        - .gitattributes
        - .github/workflows/**
        - render.yaml

  - type: web
    name: yfn-web
    runtime: static
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run test && npm --prefix frontend run generate
    staticPublishPath: frontend/.output/public
    envVars:
      - key: NODE_VERSION
        value: 24.20.0
      - key: NUXT_PUBLIC_API_ORIGIN
        fromService:
          type: web
          name: yfn-api
          envVarKey: RENDER_EXTERNAL_URL
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /api-test-console*
        name: X-Robots-Tag
        value: noindex, nofollow
    routes:
      - type: rewrite
        source: /*
        destination: /200.html
    buildFilter:
      paths:
        - frontend/**
        - contracts/**
        - .nvmrc
        - .gitattributes
        - .github/workflows/**
        - render.yaml
